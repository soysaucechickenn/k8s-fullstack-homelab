apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
spec:
  replicas: 4
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
        - name: backend
          image: task-manager:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: orbit
            - name: DB_USER
              value: orbit
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-db-secret
                  key: DB_PASSWORD