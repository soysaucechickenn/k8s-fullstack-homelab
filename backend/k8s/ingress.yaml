apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: orbit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbit-frontend-service
                port:
                  number: 80

    - host: api.orbit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-manager-service
                port:
                  number: 80