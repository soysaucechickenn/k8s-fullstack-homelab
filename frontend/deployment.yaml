
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-frontend

spec:
  replicas: 4

  selector:
    matchLabels:
      app: orbit-frontend

  template:
    metadata:
      labels:
        app: orbit-frontend

    spec:
      nodeSelector:
        workload: frontend

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: orbit-frontend

      containers:
        - name: frontend
          image: orbit-frontend:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
